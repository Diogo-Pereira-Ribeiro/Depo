name: Build and Publish Extensions

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'lib/**'
      - 'lib-multisrc/**'
      - 'core/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build all extensions
        run: |
          chmod +x gradlew
          ./gradlew :src:pt:hentaistube:assembleRelease -x lint --stacktrace || true

      - name: Generate index
        run: |
          python3 .github/scripts/generate-index.py

      - name: Create repo structure
        run: |
          mkdir -p repo/apk
          mkdir -p repo/icon
          find build -name "*.apk" -type f | head -20 | while read apk; do
            cp "$apk" repo/apk/ 2>/dev/null || true
          done

      - name: Push to repo branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout --orphan repo 2>/dev/null || git checkout repo
          git rm -rf . --cached 2>/dev/null || true
          rm -rf .github src core gradle lib lib-multisrc common 2>/dev/null || true
          git add repo/ index.json index.min.json repo.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update extensions index [$(date '+%Y-%m-%d %H:%M:%S')]"
            git push -u origin repo --force
          fi
        continue-on-error: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-artifacts
          path: |
            repo/
            index.json
            index.min.json
          retention-days: 7
