name: Build and Publish Extensions

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'lib/**'
      - 'lib-multisrc/**'
      - 'core/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build selected extensions
        run: |
          chmod +x gradlew
          ./gradlew :src:pt:animeq:assembleRelease :src:pt:animesdrive:assembleRelease :src:pt:anitube:assembleRelease :src:pt:hentaistube:assembleRelease -x lint --stacktrace 2>&1 || echo "Build completed with warnings"

      - name: Create repo structure
        run: |
          mkdir -p repo/apk
          mkdir -p repo/icon
          echo "📁 Copiando APKs..."
          find build -name "*.apk" -type f 2>/dev/null | while read apk; do
            echo "   → $apk"
            cp "$apk" repo/apk/ 2>/dev/null || true
          done
          ls -la repo/apk/ || echo "Sem APKs"

      - name: Generate index
        run: |
          chmod +x .github/scripts/generate-index.py
          python3 .github/scripts/generate-index.py

      - name: Setup Git credentials
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Push to repo branch
        run: |
          set -euo pipefail
          set -x

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          echo "Remote before change:"
          git remote -v || true

          # Ensure auth using GITHUB_TOKEN for pushes
          if [ -n "${{ secrets.GITHUB_TOKEN }}" ]; then
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git || true
          fi
          git fetch origin --prune || true

          # Checkout or create repo branch
          if git ls-remote --exit-code --heads origin repo >/dev/null 2>&1; then
            git checkout repo
            git reset --hard origin/repo || true
          else
            git checkout --orphan repo
            git rm -rf . || true
          fi

          # Copy generated files into repo branch root
          mkdir -p apk icon
          cp -v index.json index.min.json repo.json ./ 2>/dev/null || true
          cp -v repo/apk/* apk/ 2>/dev/null || true
          cp -v repo/icon/* icon/ 2>/dev/null || true

          touch apk/.gitkeep icon/.gitkeep

          git add -A
          git status --porcelain --untracked-files=all || true

          if git diff --cached --quiet; then
            echo "ℹ️  Sem alterações"
          else
            git commit -m "📦 Update extensions [$(date '+%Y-%m-%d %H:%M:%S')]" || true
            git push --force --set-upstream origin repo
            echo "✅ Push realizado (force)"
          fi

      - name: Fallback: Publish via GitHub API
        if: ${{ failure() }}
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            function addIfExists(arr, p, disk) {
              if (fs.existsSync(disk)) arr.push({path: p, disk});
            }

            const files = [];
            addIfExists(files, 'index.json', 'index.json');
            addIfExists(files, 'index.min.json', 'index.min.json');
            addIfExists(files, 'repo.json', 'repo.json');

            const apkDir = 'apk';
            if (fs.existsSync(apkDir)) {
              fs.readdirSync(apkDir).forEach(f => {
                addIfExists(files, `apk/${f}`, path.join(apkDir, f));
              });
            }

            const iconDir = 'icon';
            if (fs.existsSync(iconDir)) {
              fs.readdirSync(iconDir).forEach(f => {
                addIfExists(files, `icon/${f}`, path.join(iconDir, f));
              });
            }

            for (const item of files) {
              const content = fs.readFileSync(item.disk).toString('base64');
              try {
                await github.repos.createOrUpdateFileContents({
                  owner,
                  repo,
                  path: item.path,
                  message: `chore: upload ${item.path}`,
                  content,
                  branch: 'repo'
                });
                core.info(`Uploaded ${item.path}`);
              } catch (err) {
                if (err.status === 422 || err.status === 404) {
                  // try to create branch 'repo' from main then retry
                  core.info('Branch repo missing — creating from main');
                  const mainRef = await github.git.getRef({ owner, repo, ref: 'heads/main' });
                  const sha = mainRef.data.object.sha;
                  await github.git.createRef({ owner, repo, ref: 'refs/heads/repo', sha });
                  await github.repos.createOrUpdateFileContents({
                    owner,
                    repo,
                    path: item.path,
                    message: `chore: upload ${item.path}`,
                    content,
                    branch: 'repo'
                  });
                } else {
                  throw err;
                }
              }
            }

      - name: Verify index
        run: |
          if [ -f index.min.json ]; then
            echo "✅ index.min.json gerado com sucesso"
            wc -c index.min.json
            head -c 200 index.min.json
          else
            echo "❌ index.min.json não encontrado"
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: extensions-repo
          path: |
            index.json
            index.min.json
            repo.json
            repo/
          retention-days: 7
