name: Publish Index

on:
  push:
    branches: [main]
    paths:
      - 'index.min.json'
      - 'index.json'
      - 'repo.json'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      
      - name: Update repo-public branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          
          # Criar ou limpar branch repo-public
          git checkout --orphan repo-public-temp || git checkout repo-public
          git rm -rf . || true
          
          # Trazer apenas ficheiros de índice
          git checkout main -- index.json index.min.json repo.json
          
          # Commit e push
          git add index.json index.min.json repo.json
          git commit -m "Sync index files from main [$(date +'%Y-%m-%d %H:%M:%S')]" || true
          
          git branch -D repo-public 2>/dev/null || true
          git branch -m repo-public-temp repo-public
          git push -f origin repo-public
