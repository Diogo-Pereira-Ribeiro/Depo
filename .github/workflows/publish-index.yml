name: Publish Index

on:
  push:
    branches: [main]
    paths:
      - 'index.min.json'
      - 'index.json'
      - 'repo.json'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      
      - name: Setup git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Create repo-public branch with index files
        run: |
          # Fetch all branches
          git fetch origin
          
          # Try to check out existing repo-public, or create new one
          git checkout repo-public 2>/dev/null || git checkout --orphan repo-public
          
          # Remove all files
          git rm -rf . 2>/dev/null || true
          
          # Copy index files from main
          git checkout origin/main -- index.json index.min.json repo.json
          
          # Commit changes
          git add index.json index.min.json repo.json
          git commit -m "Sync index files from main - $(date +'%Y-%m-%d %H:%M:%S')" --allow-empty
          
          # Push to origin
          git push origin repo-public --force
